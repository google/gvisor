# Checks tools/licensecheck/dependencies.yaml against the dependencies and
# against governance/licensing.yaml.
name: Dependency licenses

"on":
  pull_request:
  push:
    branches:
      - master
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - run: make license-check

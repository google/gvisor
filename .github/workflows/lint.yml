# Runs the source-level lint suite on Linux, macOS, and Windows. lint.sh is
# OS-neutral and runs directly on the host. See tools/lint.sh.
name: Lint

"on":
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    # GitHub Windows runners default core.autocrlf to true, so a checkout
    # would convert everything to CRLF and make every formatting check fail.
    # Force LF everywhere so the linters see the same bytes on every OS.
    - name: Configure git to check out line endings as LF
      run: git config --global core.autocrlf false
      shell: bash

    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
      with:
        go-version-file: 'go.mod'

    - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.x'

    - name: Run linters
      run: bash tools/lint.sh
      shell: bash

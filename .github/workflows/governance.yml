# Checks that CODEOWNERS and MAINTAINERS.md match the files that
# //governance generates from governance data.
name: Governance

"on":
  pull_request:
  push:
    branches:
      - master
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - run: make governance-check

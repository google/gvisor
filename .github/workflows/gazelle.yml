# Checks that BUILD files in GAZELLE_PACKAGES match gazelle's output.
# See tools/gazelle.bzl.
name: Gazelle

"on":
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gazelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The runner's bazel is bazelisk, which honors .bazelversion.
    - run: |
        if ! bazel run //:gazelle_check; then
          echo "::error::BUILD files are out of date. Run 'make gazelle-fix' and commit the result."
          exit 1
        fi

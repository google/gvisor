# Checks that BUILD files in GAZELLE_PACKAGES match gazelle's output.
# See tools/gazelle.bzl.
name: Gazelle

"on":
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gazelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    # The runner's bazel is bazelisk, which honors .bazelversion.
    - name: Check BUILD files (apply reported diffs with bazel run //:gazelle_fix)
      run: bazel run //:gazelle_check

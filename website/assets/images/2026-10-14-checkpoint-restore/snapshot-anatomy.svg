<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Old format: one compressed file with kernel state and memory mixed. New format: separate files for kernel state, memory map, memory and filesystem." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Old format: one compressed file with kernel state and memory mixed. New format: separate files for kernel state, memory map, memory and filesystem.</title>
<rect width="960" height="330" rx="12" fill="#fcfcfb"/>
<text x="240" y="40" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold" >2018: one big compressed file</text>
<text x="720" y="40" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold" >Today: split by job</text>
<rect x="60" y="70" width="360" height="180" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
<text x="240" y="96" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">checkpoint.img  (compressed)</text>
<rect x="76" y="112" width="16" height="60" rx="2" fill="#2a78d6" />
<rect x="94" y="112" width="44" height="60" rx="2" fill="#6250d6" />
<rect x="140" y="112" width="8" height="60" rx="2" fill="#2a78d6" />
<rect x="150" y="112" width="68" height="60" rx="2" fill="#6250d6" />
<rect x="220" y="112" width="22" height="60" rx="2" fill="#2a78d6" />
<rect x="244" y="112" width="36" height="60" rx="2" fill="#6250d6" />
<rect x="282" y="112" width="12" height="60" rx="2" fill="#2a78d6" />
<rect x="296" y="112" width="58" height="60" rx="2" fill="#6250d6" />
<rect x="356" y="112" width="10" height="60" rx="2" fill="#2a78d6" />
<rect x="368" y="112" width="34" height="60" rx="2" fill="#6250d6" />
<text x="240" y="200" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal" >kernel objects and app memory, mixed</text>
<text x="240" y="220" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal" >in one stream: read it start to end,</text>
<text x="240" y="240" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal" >decompress every byte, one thread</text>
<text x="500" y="88" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">checkpoint.img</text>
<text x="500" y="104" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" >kernel objects</text>
<rect x="700" y="76" width="18.0" height="26" rx="4" fill="#2a78d6" />
<text x="726.0" y="94" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" >211 KB</text>
<text x="500" y="134" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">pages_meta.img</text>
<text x="500" y="150" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" >where each page goes</text>
<rect x="700" y="122" width="4.8" height="26" rx="4" fill="#1baf7a" />
<text x="712.8" y="140" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" >1.9 KB</text>
<text x="500" y="180" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">pages.img</text>
<text x="500" y="196" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" >raw app memory, no zero pages</text>
<rect x="700" y="168" width="198.0" height="26" rx="4" fill="#6250d6" />
<text x="906.0" y="186" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" >70.7 MB</text>
<text x="500" y="226" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">fs/</text>
<text x="500" y="242" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" >optional filesystem snapshot</text>
<rect x="700" y="214" width="54.0" height="26" rx="4" fill="#eda100" />
<text x="762.0" y="232" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" >your data</text>
<text x="720" y="280" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" >Sizes: a 64 MiB Python sandbox. Each file can be read</text>
<text x="720" y="298" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" >in parallel, with O_DIRECT, or in the background.</text>
<rect x="76" y="266" width="14" height="14" rx="2" fill="#2a78d6" />
<text x="96" y="278" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >kernel state</text>
<rect x="200" y="266" width="14" height="14" rx="2" fill="#6250d6" />
<text x="220" y="278" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >app memory</text>
</svg>

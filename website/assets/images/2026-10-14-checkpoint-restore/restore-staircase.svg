<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Restore time for a 2 GiB app. From a slow disk (cold page cache): 2018 style compressed, single file 5,106 ms, 2024 uncompressed, split, parallel 5,067 ms, 2024+ + restore --background 939 ms. Image already in host page cache: 2018 style compressed, single file 651 ms, 2024 uncompressed, split, parallel 322 ms, 2024+ + restore --background 71 ms" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Restore time for a 2 GiB app. From a slow disk (cold page cache): 2018 style compressed, single file 5,106 ms, 2024 uncompressed, split, parallel 5,067 ms, 2024+ + restore --background 939 ms. Image already in host page cache: 2018 style compressed, single file 651 ms, 2024 uncompressed, split, parallel 322 ms, 2024+ + restore --background 71 ms</title>
<rect width="960" height="540" rx="12" fill="#fcfcfb"/>
<text x="40" y="40" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="bold" >Time until a 2 GiB app runs again after restore</text>
<text x="40" y="62" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" >milliseconds, lower is better. Median of 32 interleaved runs.</text>
<text x="40" y="106" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >From a slow disk (cold page cache)</text>
<text x="40" y="134" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2018 style</text>
<text x="40" y="152" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >compressed, single file</text>
<rect x="330" y="122" width="500.0" height="30" rx="4" fill="#8a8984" />
<text x="840.0" y="143" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >5,106 ms</text>
<text x="40" y="184" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2024</text>
<text x="40" y="202" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >uncompressed, split, parallel</text>
<rect x="330" y="172" width="496.1380776362767" height="30" rx="4" fill="#2a78d6" />
<text x="836.1380776362766" y="193" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >5,067 ms</text>
<text x="40" y="234" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2024+</text>
<text x="40" y="252" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >+ restore --background</text>
<rect x="330" y="222" width="91.93356434990548" height="30" rx="4" fill="#1baf7a" />
<text x="431.9335643499055" y="243" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >939 ms</text>
<text x="330" y="270" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" >5.4x faster</text>
<text x="40" y="312" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >Image already in host page cache</text>
<text x="40" y="340" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2018 style</text>
<text x="40" y="358" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >compressed, single file</text>
<rect x="330" y="328" width="63.7795782050631" height="30" rx="4" fill="#8a8984" />
<text x="403.7795782050631" y="349" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >651 ms</text>
<text x="40" y="390" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2024</text>
<text x="40" y="408" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >uncompressed, split, parallel</text>
<rect x="330" y="378" width="31.483169584724656" height="30" rx="4" fill="#2a78d6" />
<text x="371.48316958472464" y="399" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >322 ms</text>
<text x="40" y="440" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2024+</text>
<text x="40" y="458" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >+ restore --background</text>
<rect x="330" y="428" width="6.903800100041032" height="30" rx="4" fill="#1baf7a" />
<text x="346.90380010004105" y="449" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" >71 ms</text>
<text x="330" y="476" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" >9.2x faster</text>
<text x="40" y="522" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" >With --background, memory keeps loading after the app starts; pages the app touches are loaded first.</text>
</svg>

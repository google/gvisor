<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" role="img" aria-label="Host page cache used by a 2 GiB snapshot: After checkpoint default 2053 MiB, After checkpoint --direct 2 MiB, After restore default 2115 MiB, After restore --direct 64 MiB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Host page cache used by a 2 GiB snapshot: After checkpoint default 2053 MiB, After checkpoint --direct 2 MiB, After restore default 2115 MiB, After restore --direct 64 MiB</title>
<rect width="960" height="388" rx="12" fill="#fcfcfb"/>
<text x="40" y="40" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="bold" >Host page cache used by a 2 GiB snapshot</text>
<text x="40" y="62" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" >MiB of extra host memory, lower is better</text>
<text x="40" y="106" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" >After checkpoint</text>
<text x="40" y="126" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" >default</text>
<rect x="330" y="92" width="465.92907801418437" height="36" rx="4" fill="#8a8984" />
<text x="805.9290780141844" y="116" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2,053 MiB</text>
<text x="40" y="170" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" >After checkpoint</text>
<text x="40" y="190" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">--direct</text>
<rect x="330" y="156" width="4" height="36" rx="4" fill="#1baf7a" />
<text x="344" y="180" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2 MiB</text>
<text x="40" y="234" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" >After restore</text>
<text x="40" y="254" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" >default</text>
<rect x="330" y="220" width="480.0" height="36" rx="4" fill="#8a8984" />
<text x="820.0" y="236" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" >2,115 MiB</text>
<text x="820.0" y="254" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >restore 7.9 s</text>
<text x="40" y="298" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" >After restore</text>
<text x="40" y="318" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">--direct</text>
<rect x="330" y="284" width="14.52482269503546" height="36" rx="4" fill="#1baf7a" />
<text x="354.5248226950355" y="300" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" >64 MiB</text>
<text x="354.5248226950355" y="318" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >restore 7.9 s</text>
<text x="40" y="366" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" >With --direct, the snapshot does not stay in host memory after you are done with it.</text>
</svg>

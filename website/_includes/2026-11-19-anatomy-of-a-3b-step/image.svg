<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="im-hh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="d-head-hot"/>
    </marker>
    <marker id="im-h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="d-head"/>
    </marker>
  </defs>

  <!-- bootstrap -->
  <rect x="20" y="20" width="310" height="340" rx="10" class="d-box-hot"/>
  <text x="36" y="45" class="d-name">bootstrap</text>
  <text x="120" y="45" class="d-note">EROFS, no file contents</text>

  <text x="36" y="74" class="d-tag">DEVICES</text>
  <rect x="36" y="82" width="278" height="22" rx="4" class="d-cell"/>
  <text x="46" y="97">1  a base image layer</text>
  <rect x="36" y="108" width="278" height="22" rx="4" class="d-cell"/>
  <text x="46" y="123">2  pip install layer</text>
  <rect x="36" y="134" width="278" height="22" rx="4" class="d-cell"/>
  <text x="46" y="149">3  COPY . layer</text>

  <text x="36" y="182" class="d-tag">INODES</text>
  <rect x="36" y="190" width="278" height="40" rx="4" class="d-cell"/>
  <text x="46" y="206">…/python3.13/json/__init__.py</text>
  <text x="46" y="222" class="d-note">chunk: device 1, block 58</text>
  <rect x="36" y="236" width="278" height="40" rx="4" class="d-cell"/>
  <text x="46" y="252">…/site-packages/requests/api.py</text>
  <text x="46" y="268" class="d-note">chunk: device 2, block 3</text>
  <rect x="36" y="282" width="278" height="40" rx="4" class="d-cell"/>
  <text x="46" y="298">/app/script.py</text>
  <text x="46" y="314" class="d-note">chunk: device 3, block 0</text>
  <text x="36" y="344" class="d-note">and every other inode and directory</text>

  <!-- blobs -->
  <text x="380" y="68" class="d-name">blob 1</text>
  <text x="440" y="68" class="d-note">python:3.13-slim</text>
  <g>
    <rect x="380" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="404" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="428" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="452" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="476" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="500" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="524" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="548" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="572" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="596" y="80" width="22" height="22" rx="3" class="d-cell-hot"/>
    <rect x="620" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="644" y="80" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="668" y="80" width="22" height="22" rx="3" class="d-cell"/>
  </g>

  <text x="380" y="178" class="d-name">blob 2</text>
  <text x="440" y="178" class="d-note">pip install</text>
  <g>
    <rect x="380" y="190" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="404" y="190" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="428" y="190" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="452" y="190" width="22" height="22" rx="3" class="d-cell-hot"/>
    <rect x="476" y="190" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="500" y="190" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="524" y="190" width="22" height="22" rx="3" class="d-cell"/>
    <rect x="548" y="190" width="22" height="22" rx="3" class="d-cell"/>
  </g>

  <text x="380" y="288" class="d-name">blob 3</text>
  <text x="440" y="288" class="d-note">COPY .</text>
  <g>
    <rect x="380" y="300" width="22" height="22" rx="3" class="d-cell-hot"/>
    <rect x="404" y="300" width="22" height="22" rx="3" class="d-cell"/>
  </g>

  <text x="380" y="140" class="d-note">each cell is one compressed chunk</text>
  <text x="380" y="155" class="d-note">with its own digest</text>

  <!-- references -->
  <path d="M314 214 H346 V116 H607 V106" class="d-line-hot" marker-end="url(#im-hh)"/>
  <path d="M314 260 H356 V226 H463 V216" class="d-line-hot" marker-end="url(#im-hh)"/>
  <path d="M314 311 H376" class="d-line-hot" marker-end="url(#im-hh)"/>

  <!-- another image built on the same base -->
  <rect x="380" y="368" width="300" height="46" rx="8" class="d-ghost"/>
  <text x="394" y="388" class="d-name">another step’s image</text>
  <text x="394" y="404" class="d-note">same base, so the same blob 1</text>
  <path d="M680 391 H704 V91 H694" class="d-line d-dash" marker-end="url(#im-h)"/>
</svg>

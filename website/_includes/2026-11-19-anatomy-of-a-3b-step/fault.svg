<svg viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ft-h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="d-head"/>
    </marker>
    <marker id="ft-hh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="d-head-hot"/>
    </marker>
  </defs>

  <!-- lanes -->
  <rect x="10" y="20" width="120" height="36" rx="8" class="d-box"/>
  <text x="70" y="43" text-anchor="middle" class="d-name">step process</text>
  <rect x="190" y="20" width="120" height="36" rx="8" class="d-box-hot"/>
  <text x="250" y="43" text-anchor="middle" class="d-name">sentry</text>
  <rect x="385" y="20" width="150" height="36" rx="8" class="d-box"/>
  <text x="460" y="43" text-anchor="middle" class="d-name">storage gateway</text>
  <rect x="590" y="20" width="120" height="36" rx="8" class="d-box"/>
  <text x="650" y="43" text-anchor="middle" class="d-name">Spongeblob</text>

  <path d="M70 56 V528 M250 56 V528 M460 56 V528 M650 56 V528" class="d-line d-dash"/>

  <!-- the cold fault -->
  <path d="M70 100 H248" class="d-line" marker-end="url(#ft-h)"/>
  <text x="160" y="92" text-anchor="middle" class="d-note">fault in an image page</text>

  <text x="262" y="122" class="d-note">→ device 1, block 58</text>
  <text x="262" y="137" class="d-note">not in the ready bitmap</text>
  <g>
    <rect x="262" y="145" width="14" height="12" rx="2" class="d-cell"/>
    <rect x="278" y="145" width="14" height="12" rx="2" class="d-cell"/>
    <rect x="294" y="145" width="14" height="12" rx="2" class="d-cell"/>
    <rect x="310" y="145" width="14" height="12" rx="2" class="d-cell"/>
    <rect x="326" y="145" width="14" height="12" rx="2" class="d-cell"/>
    <rect x="342" y="145" width="14" height="12" rx="2" class="d-cell"/>
    <rect x="358" y="145" width="14" height="12" rx="2" class="d-cell"/>
    <rect x="374" y="145" width="14" height="12" rx="2" class="d-cell"/>
  </g>
  <g opacity="0">
    <rect x="294" y="145" width="14" height="12" rx="2" class="d-cell-hot"/>
    <rect x="310" y="145" width="14" height="12" rx="2" class="d-cell-hot"/>
    <rect x="326" y="145" width="14" height="12" rx="2" class="d-cell-hot"/>
    <rect x="342" y="145" width="14" height="12" rx="2" class="d-cell-hot"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.68;0.69;1"/>
  </g>

  <path d="M250 184 H458" class="d-line-hot" marker-end="url(#ft-hh)"/>
  <text x="355" y="176" text-anchor="middle" class="d-note">{device, offset, ≤ 64 KiB}</text>

  <text x="472" y="214" class="d-note">chunk absent on worker</text>

  <path d="M460 250 H648" class="d-line" marker-end="url(#ft-h)"/>
  <text x="555" y="242" text-anchor="middle" class="d-note">read compressed chunk</text>
  <path d="M650 284 H462" class="d-line d-dash" marker-end="url(#ft-h)"/>
  <text x="555" y="276" text-anchor="middle" class="d-note">bytes</text>

  <text x="472" y="316" class="d-note">decompress into the</text>
  <text x="472" y="331" class="d-note">backing file, verify</text>
  <g>
    <rect x="472" y="342" width="20" height="14" rx="2" class="d-cell"/>
    <rect x="496" y="342" width="20" height="14" rx="2" class="d-cell"/>
    <rect x="520" y="342" width="20" height="14" rx="2" class="d-cell"/>
    <rect x="544" y="342" width="20" height="14" rx="2" class="d-cell"/>
    <rect x="568" y="342" width="20" height="14" rx="2" class="d-cell"/>
    <rect x="592" y="342" width="20" height="14" rx="2" class="d-cell"/>
  </g>
  <g opacity="0">
    <rect x="520" y="342" width="20" height="14" rx="2" class="d-cell-hot"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.52;0.53;1"/>
  </g>
  <text x="472" y="374" class="d-note">backing file on the worker</text>

  <path d="M460 394 H252" class="d-line-hot" marker-end="url(#ft-hh)"/>
  <text x="355" y="386" text-anchor="middle" class="d-note">{ok, start, end} + fd</text>

  <text x="262" y="422" class="d-note">check the fd and range,</text>
  <text x="262" y="437" class="d-note">mmap, mark pages ready</text>

  <path d="M250 480 H72" class="d-line" marker-end="url(#ft-h)"/>
  <text x="160" y="472" text-anchor="middle" class="d-note">page mapped</text>

  <!-- the warm fault -->
  <path d="M70 506 H248" class="d-line d-dash" marker-end="url(#ft-h)"/>
  <path d="M250 516 H72" class="d-line d-dash" marker-end="url(#ft-h)"/>
  <text x="262" y="515" class="d-note">fault in ready range: no request</text>

  <path id="ft-cold" d="M70 100 H250 V184 H460 V250 H650 V284 H460 V394 H250 V480 H70" fill="none" stroke="none"/>
  <path id="ft-warm" d="M70 506 H250 V516 H70" fill="none" stroke="none"/>

  <g class="d-moving">
    <circle r="5" class="d-pulse">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#ft-cold"/></animateMotion>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.8;0.801;1"/>
    </circle>
    <circle r="4" class="d-pulse">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.84;0.96;1" calcMode="linear"><mpath href="#ft-warm"/></animateMotion>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.839;0.84;0.96;0.961;1"/>
    </circle>
  </g>
</svg>

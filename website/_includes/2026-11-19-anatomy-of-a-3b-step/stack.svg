<svg viewBox="0 0 840 508" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="sk-h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" class="d-head"/>
    </marker>
    <marker id="sk-hh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

_templates:
  print: &print |
    env | grep -E '^(BUILDKITE_(COMMIT|PULL_REQUEST|SOURCE|BRANCH|BUILD_ID|GITHUB_EVENT|GITHUB_REVIEW_ID)|OVERRIDE_TEST_[A-Z_]+)=' | sort

agents:
  queue: "untrusted"

env:
  BUILDKITE_COMMIT: "1111111111111111111111111111111111111111"
  BUILDKITE_PULL_REQUEST: "false"
  BUILDKITE_SOURCE: "schedule"
  BUILDKITE_BRANCH: "master"
  BUILDKITE_GITHUB_REVIEW_ID: "111"
  OVERRIDE_TEST_PIPELINE_VAR: "pipeline-level env was applied"

steps:
  - label: "1: pipeline-level env only"
    key: "pipeline-env"
    checkout:
      skip: true
    command: *print

  - label: "2: step-level env"
    key: "step-env"
    checkout:
      skip: true
    env:
      BUILDKITE_COMMIT: "2222222222222222222222222222222222222222"
      BUILDKITE_PULL_REQUEST: "2"
      BUILDKITE_SOURCE: "ui"
      BUILDKITE_BRANCH: "master"
      BUILDKITE_GITHUB_REVIEW_ID: "222"
      OVERRIDE_TEST_STEP_VAR: "step-level env was applied"
    command: *print

  - label: "3: step-level env + checkout"
    key: "step-env-checkout"
    env:
      BUILDKITE_COMMIT: "b29c8320a862a77f4c55894d00c56eb5850c8066"
      OVERRIDE_TEST_STEP_VAR: "step-level env was applied"
    command: |
      env | grep -E '^(BUILDKITE_(COMMIT|PULL_REQUEST|SOURCE|BRANCH|BUILD_ID|GITHUB_EVENT|GITHUB_REVIEW_ID)|OVERRIDE_TEST_[A-Z_]+)=' | sort
      echo "Checked out: $$(git rev-parse HEAD)"

  - label: "4: job uploads a step with env"
    key: "dynamic-upload"
    checkout:
      skip: true
    command: |
      buildkite-agent pipeline upload <<'YAML'
      steps:
        - label: "4b: step uploaded by a job"
          key: "dynamic-step"
          checkout:
            skip: true
          env:
            BUILDKITE_COMMIT: "4444444444444444444444444444444444444444"
            BUILDKITE_PULL_REQUEST: "4"
            BUILDKITE_SOURCE: "api"
            OVERRIDE_TEST_DYNAMIC_VAR: "dynamic step env was applied"
          command: "env | grep -E '^(BUILDKITE_(COMMIT|PULL_REQUEST|SOURCE|BRANCH|BUILD_ID)|OVERRIDE_TEST_[A-Z_]+)=' | sort"
      YAML

  - label: "5: job sets buildkite:git:commit meta-data"
    key: "git-metadata"
    checkout:
      skip: true
    command: |
      buildkite-agent meta-data set "buildkite:git:commit" \
        "commit 5555555555555555555555555555555555555555"
      buildkite-agent meta-data get "buildkite:git:commit"

  - wait

  - label: "6: after the meta-data change"
    key: "after-metadata"
    checkout:
      skip: true
    command: *print

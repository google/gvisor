# Experiment to figure out how buildkite trigger steps work: a triggered build triggering another

_templates:
  print: &print
    label: ":mag: build variables"
    command: |
      for v in BUILDKITE_PIPELINE_SLUG BUILDKITE_BUILD_NUMBER BUILDKITE_BUILD_ID \
          BUILDKITE_MESSAGE BUILDKITE_SOURCE BUILDKITE_BRANCH BUILDKITE_COMMIT \
          BUILDKITE_PULL_REQUEST BUILDKITE_PULL_REQUEST_REPO \
          BUILDKITE_PULL_REQUEST_BASE_BRANCH \
          BUILDKITE_TRIGGERED_FROM_BUILD_ID BUILDKITE_TRIGGERED_FROM_BUILD_NUMBER \
          BUILDKITE_TRIGGERED_FROM_BUILD_PIPELINE_SLUG \
          BUILDKITE_REBUILT_FROM_BUILD_ID BUILDKITE_BUILD_CREATOR \
          BUILDKITE_BUILD_CREATOR_TEAMS BUILDKITE_BUILD_AUTHOR BUILDKITE_UNBLOCKER; do
        printf '%s=%s\n' "$$v" "$${!v-<unset>}"
      done
    agents:
      queue: "default"
  trigger: &trigger
    trigger: "${BUILDKITE_PIPELINE_SLUG}"
    async: true

steps:
  - *print
  - wait

  - <<: *trigger
    label: ":arrow_right: chain"
    if: build.source != "trigger_job"
    build:
      commit: "${BUILDKITE_COMMIT}"
      branch: "${BUILDKITE_BRANCH}"
      message: "trigger-exp: chain (from #${BUILDKITE_BUILD_NUMBER})"

  - <<: *trigger
    label: ":arrow_right: chain grandchild"
    if: 'build.source == "trigger_job" && build.message =~ /^trigger-exp: chain \(/'
    build:
      commit: "${BUILDKITE_COMMIT}"
      branch: "${BUILDKITE_BRANCH}"
      message: "trigger-exp: chain grandchild (from #${BUILDKITE_BUILD_NUMBER})"

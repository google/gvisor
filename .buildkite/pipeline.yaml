_templates:
  agents: &agents
    queue: "default"
    stacktest: "yes"
  quick: &quick
    command: "echo \"job $$BUILDKITE_JOB_ID on $$BUILDKITE_AGENT_NAME\" && sleep 5"
    agents: *agents
    depends_on: "timeout-test"
    allow_dependency_failure: true
    retry:
      automatic:
        - exit_status: 80
          signal_reason: stack_error
          limit: 0
        - exit_status: -1
          limit: 2
        - exit_status: "*"
          limit: 2

steps:
  - label: ":hourglass: timeout test"
    key: "timeout-test"
    command: "echo start && sleep 600 && echo 'not killed by the coordinator'"
    agents: *agents
    retry:
      automatic: false

  - { <<: *quick, label: ":zap: quick 1" }
  - { <<: *quick, label: ":zap: quick 2" }
  - { <<: *quick, label: ":zap: quick 3" }
  - { <<: *quick, label: ":zap: quick 4" }
  - { <<: *quick, label: ":zap: quick 5" }
  - { <<: *quick, label: ":zap: quick 6" }
  - { <<: *quick, label: ":zap: quick 7" }

_templates:
  quick: &quick
    command: "echo \"job $$BUILDKITE_JOB_ID on $$BUILDKITE_AGENT_NAME\""
    agents:
      queue: "default"
      stacktest: "yes"
    timeout_in_minutes: 3
    retry:
      automatic:
        - exit_status: 80
          signal_reason: stack_error
          limit: 0
        - exit_status: "*"
          limit: 2

steps:
  - { <<: *quick, label: ":zap: quick 1" }
  - { <<: *quick, label: ":zap: quick 2" }
  - { <<: *quick, label: ":zap: quick 3" }
  - { <<: *quick, label: ":zap: quick 4" }
  - { <<: *quick, label: ":zap: quick 5" }
  - { <<: *quick, label: ":zap: quick 6" }
  - { <<: *quick, label: ":zap: quick 7" }


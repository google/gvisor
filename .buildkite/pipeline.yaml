_templates:
  quick: &quick
    command: "echo \"job $$BUILDKITE_JOB_ID on $$BUILDKITE_AGENT_NAME\" && sleep 15"
    agents:
      queue: "default"
      stacktest: "yes"
    timeout_in_minutes: 4
    retry:
      automatic:
        - exit_status: 80
          signal_reason: stack_error
          limit: 0
        - exit_status: "*"
          limit: 2

steps:
  - label: ":skull: long job: VM timer (6m) across a coordinator restart"
    command: "echo start && sleep 1200 && echo 'not killed by the coordinator'"
    agents:
      queue: "default"
      stacktest: "yes"
    timeout_in_minutes: 30
    retry:
      automatic: false

  - { <<: *quick, label: ":zap: quick 01" }

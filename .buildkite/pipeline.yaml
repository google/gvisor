env:
  STUB_OUTCOME: "pass"
  # Long enough to approve a second time while the first build is running.
  STUB_SLEEP_SECONDS: "600"

agents:
  queue: "default"

steps:
  - label: ":hourglass: Stub work"
    command: |
      echo "Build #$${BUILDKITE_BUILD_NUMBER} of $${BUILDKITE_COMMIT}"
      echo "Branch $${BUILDKITE_BRANCH}, PR $${BUILDKITE_PULL_REQUEST:-none}"
      event="$${BUILDKITE_GITHUB_EVENT:-none}/$${BUILDKITE_GITHUB_ACTION:-none}"
      echo "Triggered by $${event}"
      echo "Started $$(date -u +%FT%TZ); sleeping $${STUB_SLEEP_SECONDS}s"
      sleep "$${STUB_SLEEP_SECONDS}"
      echo "Finished $$(date -u +%FT%TZ); outcome: $${STUB_OUTCOME}"
      [[ "$${STUB_OUTCOME}" == "pass" ]]
    timeout_in_minutes: 30

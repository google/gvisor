steps:
  - label: ":mag: artifact URL visibility"
    agents:
      queue: "default"
    timeout_in_minutes: 30
    retry:
      automatic: false
    command: |
      set -euo pipefail

      base="https://buildkite.com/organizations/$${BUILDKITE_ORGANIZATION_SLUG}/pipelines/$${BUILDKITE_PIPELINE_SLUG}/builds/$${BUILDKITE_BUILD_NUMBER}/jobs/$${BUILDKITE_JOB_ID}/artifacts"
      code="$$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' "$${base}")"
      if [[ "$${code}" != 200 ]]; then
        echo "The anonymous artifacts endpoint returned HTTP $${code}; is the pipeline public?" >&2
        exit 1
      fi
      echo "Upload destination: $${BUILDKITE_ARTIFACT_UPLOAD_DESTINATION:-<unset: Buildkite-managed storage>}"

      # poll logs what an anonymous viewer can currently see.
      poll() {
        local t json
        t="$$(date -u +%T.%3N)"
        if ! json="$$(curl -sf -H 'Accept: application/json' "$${base}")"; then
          echo "[poll $${t}] request failed"
          return
        fi
        if [[ "$$(jq length <<< "$${json}")" == 0 ]]; then
          echo "[poll $${t}] no artifacts listed"
          return
        fi
        jq -r '.[] | [.path, .state, .url] | @tsv' <<< "$${json}" | while IFS=$$'\t' read -r path state url; do
          loc="$$(curl -s -o /dev/null -w '%{redirect_url}' "https://buildkite.com$${url}")"
          echo "[poll $${t}] $${path}: state=$${state} redirect=$${loc:-none}"
        done
      }

      echo "--- Before any upload"
      poll

      echo "--- Phase A: small upload"
      echo "small artifact" > small.txt
      buildkite-agent artifact upload small.txt
      echo "Phase A: upload finished at $$(date -u +%T.%3N)"
      poll

      echo "--- Phase B: large upload"
      head -c 2G /dev/urandom > big.bin
      echo "Phase B: upload starting at $$(date -u +%T.%3N)"
      buildkite-agent artifact upload big.bin &
      upload_pid=$$!
      while kill -0 "$${upload_pid}" 2>/dev/null; do
        poll
        sleep 0.25
      done
      wait "$${upload_pid}"
      echo "Phase B: upload finished at $$(date -u +%T.%3N)"
      poll
      rm -f big.bin

      echo "--- Uploads done; sleeping for 10 minutes for manual checks"
      for _ in $$(seq 20); do
        sleep 30
        poll
      done

      echo "--- Cleanup"
      gcloud storage rm "$${BUILDKITE_ARTIFACT_UPLOAD_DESTINATION}/big.bin" || true

syntax = "proto3";

package gvisor.pgalloc;

message FileRangeProto {
  uint64 start = 1;
  uint64 end = 2;
}

message UnfreeRangeProto {
  uint64 start = 1;
  uint64 end = 2;
  uint64 refs = 3;
}

message MemAcctRangeProto {
  uint64 start = 1;
  uint64 end = 2;
  uint32 kind = 3;
  uint32 mem_cg_id = 4;
  bool known_committed = 5;
}

message ChunkInfoProto {
  bool huge = 1;
}

message MemoryFileMetadataProto {
  // Metadata format version for filesystem checkpoints (pages_meta), set and
  // validated in pkg/sentry/pgalloc/save_restore.go. Increment this version
  // (while keeping restore support in importMetadataProto for versions from
  // the past 12 months) whenever a change to this proto or the saved pages
  // layout alters restore semantics or would cause an older runsc binary
  // (which ignores unknown proto3 fields) to misinterpret a newer checkpoint.
  uint64 version = 1;
  repeated ChunkInfoProto chunks = 2;
  repeated MemAcctRangeProto mem_acct = 3;
  repeated UnfreeRangeProto unfree_small = 4;
  repeated UnfreeRangeProto unfree_huge = 5;
  repeated FileRangeProto unwaste_small = 6;
  repeated FileRangeProto unwaste_huge = 7;
  map<uint64, uint64> subreleased = 8;

  // In version 2, the pages file contains only the saved runs of the
  // MemoryFile, in order of offset, followed by padding to a page boundary.
  // All other bytes in known-committed pages are zero. saved_runs holds two
  // numbers per run, in units of saved_block_size bytes: the distance from the
  // end of the previous run (or from offset 0, for the first run) to the start
  // of the run, and the length of the run. Both are usually small, so their
  // packed varint encoding takes about two bytes per run.
  repeated uint64 saved_runs = 9;
  uint64 saved_block_size = 10;
}

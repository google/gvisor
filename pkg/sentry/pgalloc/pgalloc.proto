syntax = "proto3";

package gvisor.pgalloc;

message FileRangeProto {
  uint64 start = 1;
  uint64 end = 2;
}

message UnfreeRangeProto {
  uint64 start = 1;
  uint64 end = 2;
  uint64 refs = 3;
}

message MemAcctRangeProto {
  uint64 start = 1;
  uint64 end = 2;
  uint32 kind = 3;
  uint32 mem_cg_id = 4;
  bool known_committed = 5;
}

message ChunkInfoProto {
  bool huge = 1;
}

message MemoryFileMetadataProto {
  uint64 version = 1;
  repeated ChunkInfoProto chunks = 2;
  repeated MemAcctRangeProto mem_acct = 3;
  repeated UnfreeRangeProto unfree_small = 4;
  repeated UnfreeRangeProto unfree_huge = 5;
  repeated FileRangeProto unwaste_small = 6;
  repeated FileRangeProto unwaste_huge = 7;
  map<uint64, uint64> subreleased = 8;

  // If subpage_size is non-zero, each committed page was saved to the pages
  // file as only its subpage_size-byte blocks whose bits are set in the
  // corresponding element of subpage_masks (one per committed page, in
  // MemoryFile offset order); all other blocks are zero. Metadata with these
  // fields has version 2, so that readers that only support version 1, and
  // would ignore these fields, reject it.
  uint64 subpage_size = 9;
  repeated uint64 subpage_masks = 10;
}

syntax = "proto3";

package gvisor.fscheckpoint;

message ResourceID {
  string container_name = 1;
  string path = 2;
}

message MemoryFile {
  ResourceID resource_id = 1;
  uint64 pages_metadata_start = 2;
  uint64 pages_metadata_end = 3;
  uint64 pages_start = 4;
}

message Tmpfs {
  ResourceID resource_id = 1;
  uint64 tar_start = 2;
  uint64 tar_end = 3;
}

message Manifest {
  // Checkpoint format version, set in pkg/sentry/kernel/fscheckpoint.go and
  // validated in runsc/boot/fscheckpoint.go. Increment this version (while
  // keeping restore support for versions from the past 12 months) whenever
  // changing this proto or the on-disk checkpoint layout (such as multitar
  // regular-file encodings in pkg/sentry/fsimpl/tmpfs/fscheckpoint.go) in a
  // way that requires restore to distinguish old and new checkpoints, or that
  // would cause an older runsc binary (which ignores unknown proto3 fields) to
  // misinterpret a newer checkpoint.
  uint64 version = 1;
  string runsc_version = 2;
  uint64 page_size = 3;
  // TODO: NOLINT - Currently this must match during restore. Removing this
  // requirement requires fixing an endianness for
  // tmpfs.fsckptRegularFileSegment.
  string endian = 4;
  repeated MemoryFile memory_files = 5;
  repeated Tmpfs tmpfs = 6;
}
